[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc-version = "0.8.25"
optimizer = true
optimizer_runs = 420_000
via_ir = true
fuzz_max_global_rejects = 420_000

gas_reports = [
    "BBitsBadges",
    "BBitsSocial",
    "BBitsCheckIn",
    "BBitsBadge7Day",
    "BBitsBadgeFirstClick",
    "BBitsBadgeBearPunk",
    "BBitsRaffle",
    "BBitsEmoji",
    "BBitsSocialRewards"
]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/contracts",
    "@dll/=lib/Doubly-Linked-List/src",
    "@script/=script",
    "@src/=src",
    "@test/=test",
]

# LuckyGhouls exceeds the EIP-170 size limit at 420k optimizer runs; deploy/verify it with
# FOUNDRY_PROFILE=luckyghouls (inherits everything else from the default profile).
[profile.luckyghouls]
optimizer_runs = 200
